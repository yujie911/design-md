<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Design.md - 精选设计系统预览</title>
    <meta name="description" content="精选54个顶级品牌设计，为AI代码生成提供设计参考">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CSS Variables - Vercel Inspired Design System
           ============================================ */
        :root {
            /* Colors - Light Mode */
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-tertiary: #f5f5f5;
            --text-primary: #171717;
            --text-secondary: #666666;
            --text-tertiary: #888888;
            --border-color: #eaeaea;
            --border-hover: #d4d4d4;
            --accent-color: #171717;
            --accent-hover: #000000;
            --card-bg: #ffffff;
            --tag-bg: #f5f5f5;
            --tag-text: #666666;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
        }

        /* Dark Mode - System Preference */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a0a0a;
                --bg-secondary: #111111;
                --bg-tertiary: #1a1a1a;
                --text-primary: #fafafa;
                --text-secondary: #a0a0a0;
                --text-tertiary: #666666;
                --border-color: #2a2a2a;
                --border-hover: #3a3a3a;
                --accent-color: #fafafa;
                --accent-hover: #ffffff;
                --card-bg: #111111;
                --tag-bg: #1a1a1a;
                --tag-text: #a0a0a0;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
            }
        }

        /* Dark Mode - Manual Toggle */
        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666666;
            --border-color: #2a2a2a;
            --border-hover: #3a3a3a;
            --accent-color: #fafafa;
            --accent-hover: #ffffff;
            --card-bg: #111111;
            --tag-bg: #1a1a1a;
            --tag-text: #a0a0a0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        /* ============================================
           Reset & Base Styles
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================
           Layout Container
           ============================================ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        @media (min-width: 768px) {
            .container {
                padding: 0 32px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                padding: 0 48px;
            }
        }

        /* ============================================
           Header Section
           ============================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.8);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            .header {
                background-color: rgba(10, 10, 10, 0.8);
            }
        }

        [data-theme="dark"] .header {
            background-color: rgba(10, 10, 10, 0.8);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #171717 0%, #444444 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        @media (prefers-color-scheme: dark) {
            .logo-icon {
                background: linear-gradient(135deg, #fafafa 0%, #a0a0a0 100%);
                color: #0a0a0a;
            }
        }

        [data-theme="dark"] .logo-icon {
            background: linear-gradient(135deg, #fafafa 0%, #a0a0a0 100%);
            color: #0a0a0a;
        }

        .search-wrapper {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 44px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .search-input:hover {
            border-color: var(--border-hover);
        }

        .search-input:focus {
            border-color: var(--text-secondary);
            background-color: var(--bg-primary);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-shortcut {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 8px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-weight: 500;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            padding: 0;
            border: none;
            background: var(--bg-tertiary);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: all 0.2s ease;
        }

        .search-clear:hover {
            background: var(--border-hover);
            color: var(--text-secondary);
        }

        .search-clear.visible {
            display: flex;
        }

        .search-clear svg {
            width: 14px;
            height: 14px;
        }

        .search-wrapper.has-content .search-shortcut {
            display: none;
        }

        @media (max-width: 640px) {
            .search-shortcut {
                display: none;
            }
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .stat-number {
            font-weight: 700;
            color: var(--text-primary);
        }

        .version-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            background-color: #dcfce7;
            color: #166534;
            font-size: 0.6875rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            margin-left: 12px;
            border: 1px solid #bbf7d0;
        }

        @media (prefers-color-scheme: dark) {
            .version-tag {
                background-color: #14532d;
                color: #86efac;
                border-color: #166534;
            }
        }

        [data-theme="dark"] .version-tag {
            background-color: #14532d;
            color: #86efac;
            border-color: #166534;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .sun-icon {
            display: none;
        }

        .theme-toggle .moon-icon {
            display: block;
        }

        /* Dark mode active state */
        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }

        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }

        @media (max-width: 768px) {
            .header-stats {
                display: none;
            }
        }

        /* ============================================
           Hero Section
           ============================================ */
        .hero {
            padding: 80px 0 60px;
            text-align: center;
        }

        @media (min-width: 768px) {
            .hero {
                padding: 100px 0 80px;
            }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--tag-bg);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .hero-badge-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hero-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-description {
            font-size: clamp(1.125rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .hero-tag {
            padding: 6px 14px;
            background-color: var(--tag-bg);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            color: var(--tag-text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }

        .hero-tag:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .hero-tag.active {
            background-color: var(--accent-color);
            color: var(--bg-primary);
        }

        /* ============================================
           Filter Bar
           ============================================ */
        .filter-bar {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 32px;
            position: sticky;
            top: 72px;
            background-color: var(--bg-primary);
            z-index: 50;
        }

        .filter-content {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow-x: auto;
            /* 隐藏滚动条 - IE和Edge */
            -ms-overflow-style: none;
        }

        /* Firefox */
        @supports (scrollbar-width: none) {
            .filter-content {
                scrollbar-width: none;
            }
        }

        /* Chrome, Safari, Opera */
        .filter-content::-webkit-scrollbar {
            display: none;
        }

        .filter-label {
            font-size: 0.875rem;
            color: var(--text-tertiary);
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .filter-tag {
            padding: 6px 14px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
        }

        .filter-tag:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .filter-tag.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-primary);
        }

        /* ============================================
           Grid Layout
           ============================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 24px;
            padding-bottom: 80px;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1280px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* ============================================
           Card Component
           ============================================ */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .card-preview {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background-color: var(--bg-secondary);
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-preview img {
            transform: scale(1.02);
        }

        .card-preview-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            gap: 12px;
        }

        .card:hover .card-preview-overlay {
            opacity: 1;
        }

        .preview-btn {
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.95);
            color: #171717;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .preview-btn:hover {
            background-color: #ffffff;
            transform: scale(1.05);
        }

        .preview-btn.dark {
            background-color: rgba(23, 23, 23, 0.95);
            color: #fafafa;
        }

        @media (prefers-color-scheme: dark) {
            .preview-btn {
                background-color: rgba(23, 23, 23, 0.95);
                color: #fafafa;
            }
            .preview-btn.dark {
                background-color: rgba(255, 255, 255, 0.95);
                color: #171717;
            }
        }

        [data-theme="dark"] .preview-btn {
            background-color: rgba(23, 23, 23, 0.95);
            color: #fafafa;
        }

        [data-theme="dark"] .preview-btn.dark {
            background-color: rgba(255, 255, 255, 0.95);
            color: #171717;
        }

        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .card-title-link {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .card-title-link:hover {
            color: var(--accent-color);
        }

        .card-badge {
            padding: 4px 10px;
            background-color: var(--tag-bg);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--tag-text);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .card-description {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .card-tag {
            padding: 4px 10px;
            background-color: var(--tag-bg);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--tag-text);
            font-weight: 500;
        }

        /* ============================================
           Empty State
           ============================================ */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background-color: var(--tag-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state-description {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        /* ============================================
           Footer
           ============================================ */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 0;
            text-align: center;
        }

        .footer-text {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--text-primary);
        }

        .footer-copyright {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* ============================================
           Loading Animation
           ============================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.5s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
        .card:nth-child(9) { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.5s; }
        .card:nth-child(11) { animation-delay: 0.55s; }
        .card:nth-child(12) { animation-delay: 0.6s; }

        /* ============================================
           Highlight Search Results
           ============================================ */
        .highlight {
            background-color: rgba(251, 191, 36, 0.3);
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="./" class="logo">
                    <div class="logo-icon">D</div>
                    <span>Design.md</span>
                </a>
                
                <div class="search-wrapper" id="searchWrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput"
                        placeholder="搜索设计系统..."
                        autocomplete="off"
                    >
                    <span class="search-shortcut">Ctrl K</span>
                    <button type="button" class="search-clear" id="searchClear" title="清空搜索">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18"></path>
                            <path d="m6 6 12 12"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="header-stats">
                    <span class="stat-number" id="totalCount">54</span>
                    <span>套设计系统</span>
                    <span class="version-tag">Version 1.0.2</span>
                </div>
                
                <button type="button" class="theme-toggle" id="themeToggle" title="切换主题">

        /**
         * 当前筛选状态
         */
        let currentFilter = 'all';
        let currentSearch = '';

        /**
         * 初始化应用
         */
        function init() {
            renderCards(designSystems);
            setupEventListeners();
            setupKeyboardShortcuts();
            setupThemeToggle();
        }

        /**
         * 设置主题切换功能
         */
        function setupThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            // 检查本地存储或系统偏好
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            // 初始化主题
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
            }
            
            // 切换主题
            themeToggle.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
            
            // 监听系统主题变化
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                }
            });
        }

        /**
         * 渲染卡片列表
         * @param {Array} systems - 设计系统数据数组
         */
        function renderCards(systems) {
            const grid = document.getElementById('designGrid');
            const totalCount = document.getElementById('totalCount');
            
            // 更新计数
            totalCount.textContent = systems.length;
            
            // 清空网格
            grid.innerHTML = '';
            
            // 空状态处理
            if (systems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3 class="empty-state-title">未找到匹配的设计系统</h3>
                        <p class="empty-state-description">尝试使用其他关键词或清除筛选条件</p>
                    </div>
                `;
                return;
            }
            
            // 渲染卡片
            systems.forEach((system, index) => {
                const card = createCard(system, index);
                grid.appendChild(card);
            });
        }

        /**
         * 创建单个卡片元素
         * @param {Object} system - 设计系统数据
         * @param {number} index - 索引用于动画延迟
         * @returns {HTMLElement} 卡片元素
         */
        function createCard(system, index) {
            const card = document.createElement('article');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.05}s`;
            
            const tagsHtml = system.category.map(tag => 
                `<span class="card-tag">${tag}</span>`
            ).join('');
            
            // 高亮搜索文本
            const highlightedName = highlightText(system.name, currentSearch);
            const highlightedDesc = highlightText(system.description, currentSearch);
            
            // 使用本地 Color Palette 图片作为卡片背景
            const paletteImage = `./assets/palettes/${system.id}-palette.png`;
            
            card.innerHTML = `
                <div class="card-preview">
                    <img src="${paletteImage}" alt="${system.name} Color Palette" loading="lazy" onerror="this.src='${system.imageLight}'">
                    <div class="card-preview-overlay">
                        <a href="${system.path}preview.html" class="preview-btn" target="_blank" rel="noopener">浅色模式</a>
                        <a href="${system.path}preview-dark.html" class="preview-btn dark" target="_blank" rel="noopener">深色模式</a>
                    </div>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h3 class="card-title"><a href="${system.path}DESIGN.md" class="card-title-link" target="_blank" rel="noopener">${highlightedName}</a></h3>
                        <span class="card-badge">${system.category[0]}</span>
                    </div>
                    <p class="card-description">${highlightedDesc}</p>
                    <div class="card-tags">
                        ${tagsHtml}
                    </div>
                </div>
            `;
            
            return card;
        }

        /**
         * 高亮搜索匹配的文本
         * @param {string} text - 原始文本
         * @param {string} query - 搜索关键词
         * @returns {string} 高亮后的HTML
         */
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        /**
         * 转义正则表达式特殊字符
         * @param {string} string - 输入字符串
         * @returns {string} 转义后的字符串
         */
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        /**
         * 筛选设计系统
         * @param {string} category - 分类筛选条件
         * @param {string} search - 搜索关键词
         * @returns {Array} 筛选后的设计系统数组
         */
        function filterSystems(category, search) {
            return designSystems.filter(system => {
                // 分类筛选
                const categoryMatch = category === 'all' || 
                    system.category.some(cat => cat.toLowerCase() === category.toLowerCase());
                
                // 搜索筛选
                const searchLower = search.toLowerCase();
                const searchMatch = !search || 
                    system.name.toLowerCase().includes(searchLower) ||
                    system.description.toLowerCase().includes(searchLower) ||
                    system.category.some(cat => cat.toLowerCase().includes(searchLower));
                
                return categoryMatch && searchMatch;
            });
        }

        /**
         * 设置事件监听器
         */
        function setupEventListeners() {
            // 搜索输入
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const searchWrapper = document.getElementById('searchWrapper');
            
            /**
             * 更新清空按钮显示状态
             */
            function updateClearButton() {
                const hasContent = searchInput.value.length > 0;
                searchClear.classList.toggle('visible', hasContent);
                searchWrapper.classList.toggle('has-content', hasContent);
            }
            
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                const filtered = filterSystems(currentFilter, currentSearch);
                renderCards(filtered);
                updateClearButton();
            });
            
            // 清空按钮点击事件
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                currentSearch = '';
                const filtered = filterSystems(currentFilter, currentSearch);
                renderCards(filtered);
                updateClearButton();
                searchInput.focus();
            });
            
            // Hero标签筛选
            document.querySelectorAll('.hero-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const filter = tag.dataset.filter;
                    
                    // 更新激活状态
                    document.querySelectorAll('.hero-tag').forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    
                    // 同步Filter Bar
                    document.querySelectorAll('.filter-tag').forEach(t => {
                        t.classList.toggle('active', t.dataset.category === filter);
                    });
                    
                    currentFilter = filter;
                    const filtered = filterSystems(currentFilter, currentSearch);
                    renderCards(filtered);
                });
            });
            
            // Filter Bar筛选
            document.querySelectorAll('.filter-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const category = tag.dataset.category;
                    
                    // 更新激活状态
                    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    
                    // 同步Hero标签
                    document.querySelectorAll('.hero-tag').forEach(t => {
                        t.classList.toggle('active', t.dataset.filter === category);
                    });
                    
                    currentFilter = category;
                    const filtered = filterSystems(currentFilter, currentSearch);
                    renderCards(filtered);
                });
            });
        }

        /**
         * 设置键盘快捷键
         */
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Ctrl/Cmd + K 聚焦搜索
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                
                // ESC 清除搜索
                if (e.key === 'Escape') {
                    const searchInput = document.getElementById('searchInput');
                    const searchClear = document.getElementById('searchClear');
                    const searchWrapper = document.getElementById('searchWrapper');
                    if (document.activeElement === searchInput) {
                        searchInput.value = '';
                        currentSearch = '';
                        const filtered = filterSystems(currentFilter, currentSearch);
                        renderCards(filtered);
                        searchClear.classList.remove('visible');
                        searchWrapper.classList.remove('has-content');
                        searchInput.blur();
                    }
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
